[project]
name = "timemachine"
version = "0.1.0"
description = "Date-conditioned multi-view diffusion: data pipeline for dated MegaScenes images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# PyTorch dataset of posed, dated views (src/timemachine/data)
torch = ["torch>=2.4", "pillow>=10"]
# Posing old photos with VGGT-Omega (src/timemachine/posing); VGGT-Omega itself comes
# from an existing checkout via VGGT_OMEGA_ROOT
posing = ["torch>=2.4", "pillow>=10", "torchvision", "transformers>=4.45"]
# Stable Virtual Camera and the libraries its code imports. SEVA itself is installed
# separately, without its pinned deps (it pins numpy==1.24.4):
#   uv pip install --no-deps "seva @ git+https://github.com/Stability-AI/stable-virtual-camera@fe19948e9b7bea261ab2db780a59656131404a83"
seva = ["torch>=2.4", "pillow>=10", "torchvision", "einops", "open-clip-torch", "kornia", "roma",
        "diffusers", "safetensors", "huggingface_hub", "scipy", "imageio", "colorama", "gradio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timemachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
