[project]
name = "timemachine"
version = "0.1.0"
description = "Date-conditioned multi-view diffusion: data pipeline for dated MegaScenes images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# PyTorch dataset of posed, dated views (src/timemachine/data)
torch = ["torch>=2.4", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timemachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
